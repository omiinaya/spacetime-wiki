[package]
name = "spacetime-wiki"
version = "1.0.0"
edition = "2021"
description = "SpacetimeDB-powered knowledge wiki — Outline-inspired with feature parity"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.8.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
sha1 = "0.11"
argon2 = "0.5"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
