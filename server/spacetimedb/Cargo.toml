[package]
name = "spacetime-wiki"
version = "0.1.0"
edition = "2021"
description = "SpacetimeDB-powered knowledge wiki — Outline-inspired with feature parity"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
