name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests (useful for quick CI runs)'
        required: false
        default: 'false'
        type: string
      skip_integration:
        description: 'Skip Python integration tests (require live STDB)'
        required: false
        default: 'false'
        type: string

jobs:
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Coverage report
        run: npx vitest run --coverage

  rust:
    name: Rust (SpacetimeDB module)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: server/spacetimedb

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/spacetimedb/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/spacetimedb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Tests
        run: cargo test --lib

      - name: Doc
        run: cargo doc --no-deps 2>&1 | tail -10

      - name: Clippy
        run: cargo clippy -- -D warnings

  python:
    name: Python (API server + MCP server)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-server/requirements.txt
          pip install -r mcp-server/requirements.txt

      - name: Run API server unit tests
        run: |
          # Integration tests (test_core_reducers, test_misc_reducers,
          # test_page_metadata_and_settings, test_collection_permission_*)
          # require a live STDB with the module published — they run in the
          # dedicated `python-integration` job below (self-hosted runner).
          python -m pytest tests/ \
            --tb=short -q \
            --ignore=tests/test_core_reducers.py \
            --ignore=tests/test_page_metadata_and_settings.py \
            --ignore=tests/test_collection_permission_search.py \
            --ignore=tests/test_collection_permission_reducers.py \
            --ignore=tests/test_misc_reducers.py

      - name: Run MCP server unit tests
        run: |
          cd mcp-server && python -m pytest tests/ --tb=short -q

  python-integration:
    name: Python integration (live STDB)
    if: ${{ !startsWith(github.event_name, 'workflow_dispatch') || github.event.inputs.skip_integration != 'true' }}
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    env:
      STDB_HOST: localhost:3001
      DB_NAME: spacetime-wiki

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-server/requirements.txt

      - name: Run reducer integration tests against live STDB
        run: |
          python -m pytest tests/test_core_reducers.py \
            tests/test_misc_reducers.py \
            tests/test_page_metadata_and_settings.py \
            tests/test_collection_permission_reducers.py \
            tests/test_collection_permission_search.py \
            --tb=short -q

  e2e:
    name: E2E (Playwright)
    if: ${{ !startsWith(github.event_name, 'workflow_dispatch') || github.event.inputs.skip_e2e != 'true' }}
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    env:
      CI: 'true'
      STDB_HOST: localhost:3001
      STDB_DATABASE: spacetime-wiki
      VITE_STDB_HOST: localhost:3001
      VITE_STDB_DB: spacetime-wiki
      VITE_API_BASE: http://localhost:8711

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npx playwright test

      - name: Cleanup E2E dependencies
        if: always()
        run: bash scripts/cleanup-e2e-deps.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7