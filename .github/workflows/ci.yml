name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests (useful for quick CI runs)'
        required: false
        default: 'false'
        type: string

jobs:
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Coverage report
        run: npx vitest run --coverage

  rust:
    name: Rust (SpacetimeDB module)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server/spacetimedb

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/spacetimedb/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/spacetimedb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Tests
        run: cargo test --lib

      - name: Doc
        run: cargo doc --no-deps 2>&1 | tail -10

      - name: Clippy
        run: cargo clippy -- -D warnings

  python:
    name: Python (API server + MCP server)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-server/requirements.txt
          pip install -r mcp-server/requirements.txt

      - name: Run API server unit tests
        run: |
          python -m pytest tests/ \
            --tb=short -q \
            --ignore=tests/test_core_reducers.py \
            --ignore=tests/test_page_metadata_and_settings.py \
            --ignore=tests/test_collection_permission_search.py \
            --ignore=tests/test_collection_permission_action.py \
            --ignore=tests/test_collection_permission_operations.py \
            --ignore=tests/test_collection_permission_propagation.py \
            --ignore=tests/test_collection_permission_reducers.py \
            --ignore=tests/test_misc_reducers.py

      - name: Run MCP server unit tests
        run: |
          cd mcp-server && python -m pytest tests/ --tb=short -q

  e2e:
    name: E2E (Playwright)
    if: ${{ !startsWith(github.event_name, 'workflow_dispatch') || github.event.inputs.skip_e2e != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    env:
      CI: 'true'
      STDB_HOST: localhost:3001
      STDB_DATABASE: spacetime-wiki
      VITE_STDB_HOST: localhost:3001
      VITE_STDB_DB: spacetime-wiki
      VITE_API_BASE: http://localhost:8711

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - name: Install SpacetimeDB CLI
        run: |
          mkdir -p /tmp/stdb-cli
          curl -sL https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.6.1/spacetime-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /tmp/stdb-cli
          echo "/tmp/stdb-cli" >> "$GITHUB_PATH"

      - name: Start SpacetimeDB (service container)
        run: |
          docker run -d --name stdb -p 3001:3001 clockworklabs/spacetime start --listen-addr 0.0.0.0:3001
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/v1/health >/dev/null 2>&1; then
              echo "STDB ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "STDB failed to start:"; docker logs stdb; exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npx playwright test

      - name: Cleanup E2E dependencies
        if: always()
        run: bash scripts/cleanup-e2e-deps.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7