name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  rust:
    name: Rust (SpacetimeDB module)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: server/spacetimedb

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/spacetimedb/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/spacetimedb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Check (clippy)
        run: cargo check

      - name: Tests
        run: cargo test --lib 2>&1 | tail -20

      - name: Clippy
        run: cargo clippy -- -D warnings 2>&1 | tail -30
        continue-on-error: true

  e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    env:
      CI: "true"
      STDB_HOST: localhost:3001
      STDB_DATABASE: spacetime-wiki
      # VITE_* vars are inlined at Vite build time (picked up from web/.env too)
      VITE_STDB_HOST: localhost:3001
      VITE_STDB_DB: spacetime-wiki
      VITE_API_BASE: http://localhost:8711

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Native STDB (port 3001) must be running on the self-hosted runner.
      # setup-e2e-deps.sh publishes the module and starts the API server (port 8711).
      # Both are managed by Playwright's webServer and auto-killed when tests finish.
      - name: Run E2E tests
        run: npx playwright test

      - name: Cleanup E2E dependencies
        if: always()
        run: bash scripts/cleanup-e2e-deps.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
