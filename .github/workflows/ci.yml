name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests (useful for quick CI runs)'
        required: false
        default: 'false'
        type: string

jobs:
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Coverage report
        run: npx vitest run --coverage

  rust:
    name: Rust (SpacetimeDB module)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: server/spacetimedb

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/spacetimedb/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/spacetimedb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Check
        run: cargo check

      - name: Tests
        run: cargo test --lib 2>&1 | tail -20

      - name: Doc
        run: cargo doc --no-deps 2>&1 | tail -10

      - name: Clippy
        run: cargo clippy -- -D warnings 2>&1 | tail -30

  e2e:
    name: E2E (Playwright)
    if: ${{ !startsWith(github.event_name, 'workflow_dispatch') || github.event.inputs.skip_e2e != 'true' }}
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    env:
      CI: 'true'
      STDB_HOST: localhost:3001
      STDB_DATABASE: spacetime-wiki
      VITE_STDB_HOST: localhost:3001
      VITE_STDB_DB: spacetime-wiki
      VITE_API_BASE: http://localhost:8711

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Cleanup E2E dependencies
        if: always()
        run: bash scripts/cleanup-e2e-deps.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7