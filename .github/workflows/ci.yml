name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests (useful for quick CI runs)'
        required: false
        default: 'false'
        type: string
      skip_integration:
        description: 'Skip Python integration tests (require live STDB)'
        required: false
        default: 'false'
        type: string

jobs:
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # The Vite production build catches export-resolution failures that tsc
      # misses (e.g. MISSING_EXPORT "sqlLit" from the api barrel — tsc/vitest
      # resolved it, the build failed). Run it here so the breakage never
      # reaches the E2E webServer step.
      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Coverage report
        run: npx vitest run --coverage

  rust:
    name: Rust (SpacetimeDB module)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: server/spacetimedb

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/spacetimedb/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/spacetimedb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Tests
        run: cargo test --lib

      - name: Doc
        run: cargo doc --no-deps 2>&1 | tail -10

      - name: Clippy
        run: cargo clippy -- -D warnings

  python:
    name: Python (API server + MCP server)
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      # actions/setup-python@v5 cannot provision prebuilt runtimes on
      # Debian-based self-hosted runners ("version '3.11' ... was not found
      # for Debian 12"). The runner carries system Python 3.11 — use it in a
      # venv (Debian's system pip is PEP-668 externally-managed and refuses
      # installs into the system site-packages).
      - name: Create venv
        run: |
          python3 --version
          python3 -m venv /tmp/stw-ci-venv
          /tmp/stw-ci-venv/bin/python -m pip --version

      - name: Install dependencies
        run: |
          /tmp/stw-ci-venv/bin/python -m pip install --upgrade pip
          # requirements-dev.txt pulls in both runtime requirements files
          # (api-server + mcp-server) plus the declared test deps
          # (pytest, pytest-asyncio, pytest-cov, pytest-timeout). This keeps
          # the job hermetic instead of relying on preinstalled runner packages.
          /tmp/stw-ci-venv/bin/pip install -r requirements-dev.txt

      - name: Run API server unit tests
        run: |
          # Integration tests (test_core_reducers, test_misc_reducers,
          # test_page_metadata_and_settings, test_collection_permission_*)
          # require a live STDB with the module published — they run in the
          # dedicated `python-integration` job below (self-hosted runner).
          /tmp/stw-ci-venv/bin/python -m pytest tests/ \
            --tb=short -q \
            --ignore=tests/test_core_reducers.py \
            --ignore=tests/test_page_metadata_and_settings.py \
            --ignore=tests/test_collection_permission_search.py \
            --ignore=tests/test_collection_permission_reducers.py \
            --ignore=tests/test_misc_reducers.py \
            --ignore=tests/test_mcp_live_stdb.py \
            --ignore=tests/test_api_live_stdb.py

      - name: Run MCP server unit tests
        run: |
          cd mcp-server && /tmp/stw-ci-venv/bin/python -m pytest tests/ --tb=short -q

  python-integration:
    name: Python integration (live STDB)
    if: ${{ !startsWith(github.event_name, 'workflow_dispatch') || github.event.inputs.skip_integration != 'true' }}
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    env:
      STDB_HOST: localhost:3001
      DB_NAME: spacetime-wiki

    steps:
      - uses: actions/checkout@v7

      # actions/setup-python@v5 cannot provision prebuilt runtimes on
      # Debian-based self-hosted runners ("version '3.11' ... was not found
      # for Debian 12"). The runner carries system Python 3.11 — use it in a
      # venv (Debian's system pip is PEP-668 externally-managed and refuses
      # installs into the system site-packages).
      - name: Create venv
        run: |
          python3 --version
          python3 -m venv /tmp/stw-ci-venv
          /tmp/stw-ci-venv/bin/python -m pip --version

      - name: Install dependencies
        run: |
          /tmp/stw-ci-venv/bin/python -m pip install --upgrade pip
          # requirements-dev.txt pulls in the API runtime deps plus the test
          # deps (pytest, pytest-asyncio) the reducer suites need.
          /tmp/stw-ci-venv/bin/pip install -r requirements-dev.txt

      - name: Publish module to live STDB
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          cd spacetimedb
          which spacetime
          cargo build --release --target=wasm32-unknown-unknown
          # Prefer the newest wasm artifact (avoid stale .opt.wasm).
          WASM=$(ls -t target/wasm32-unknown-unknown/release/spacetime_wiki*.wasm | head -1)
          echo "Publishing ${WASM}"
          # Non-destructive publish — NO --delete-data, ever. If spacetime-wiki
          # doesn't exist it is created; if it exists the schema migrates.
          spacetime publish -b "$WASM" --yes spacetime-wiki

      - name: Run reducer integration tests against live STDB
        run: |
          /tmp/stw-ci-venv/bin/python -m pytest tests/test_core_reducers.py \
            tests/test_misc_reducers.py \
            tests/test_page_metadata_and_settings.py \
            tests/test_collection_permission_reducers.py \
            tests/test_collection_permission_search.py \
            tests/test_mcp_live_stdb.py \
            tests/test_api_live_stdb.py \
            --tb=short -q

  e2e:
    name: E2E (Playwright)
    if: ${{ !startsWith(github.event_name, 'workflow_dispatch') || github.event.inputs.skip_e2e != 'true' }}
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    env:
      CI: 'true'
      STDB_HOST: localhost:3001
      # Dedicated E2E database — the E2E setup/cleanup scripts DELETE and
      # republish it, so it must never share a name with the DB the
      # python-integration job runs its reducer tests against.
      STDB_DATABASE: spacetime-wiki-e2e
      VITE_STDB_HOST: localhost:3001
      VITE_STDB_DB: spacetime-wiki-e2e
      VITE_API_BASE: http://localhost:8711

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # No --with-deps: the self-hosted runner has no passwordless sudo
        # (playwright's apt step fails with 'sudo: a password is required').
        # The browsers + system libs are already provisioned on the runner.
        run: npx playwright install chromium firefox webkit

      - name: Run E2E tests
        run: npx playwright test

      - name: Cleanup E2E dependencies
        if: always()
        run: bash scripts/cleanup-e2e-deps.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7