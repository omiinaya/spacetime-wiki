name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to release (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-images:
    name: Build & Push Docker Images
    runs-on: [self-hosted, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Extract metadata for api-server
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Extract metadata for module-publisher
        id: meta-module
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/module-publisher
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push API server
        uses: docker/build-push-action@v7
        with:
          context: server/api-server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push module-publisher
        uses: docker/build-push-action@v7
        with:
          context: server/spacetimedb
          push: true
          tags: ${{ steps.meta-module.outputs.tags }}
          labels: ${{ steps.meta-module.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: [self-hosted, ubuntu-latest]
    needs: build-images
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const response = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
            });
            return response.data.body;

      - name: Detect prerelease
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "${VERSION}" | grep -qiE '-(rc|beta|alpha|pre|dev)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.release-notes.outputs.result }}

            ## Docker Images

            - `ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name#v }}`
            - `ghcr.io/${{ github.repository }}/frontend:latest`
            - `ghcr.io/${{ github.repository }}/api-server:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/api-server:${{ github.ref_name#v }}`
            - `ghcr.io/${{ github.repository }}/api-server:latest`
            - `ghcr.io/${{ github.repository }}/module-publisher:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/module-publisher:${{ github.ref_name#v }}`
            - `ghcr.io/${{ github.repository }}/module-publisher:latest`
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false
          make_latest: true
