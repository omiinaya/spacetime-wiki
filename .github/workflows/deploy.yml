name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Images
    runs-on: [self-hosted, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (tags, labels) for api-server
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (tags, labels) for module-publisher
        id: meta-module
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/module-publisher
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push API server
        uses: docker/build-push-action@v6
        with:
          context: server/api-server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push module-publisher
        uses: docker/build-push-action@v6
        with:
          context: server/spacetimedb
          push: true
          tags: ${{ steps.meta-module.outputs.tags }}
          labels: ${{ steps.meta-module.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker compose pull --ignore-pull-failures module-publisher api-server frontend || true

      - name: Re-publish STDB module
        run: |
          docker compose up -d --no-deps module-publisher || true
        env:
          COMPOSE_FILE: docker-compose.yml

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --no-deps api-server frontend
        env:
          COMPOSE_FILE: docker-compose.yml

      - name: Health check
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8711/health > /dev/null 2>&1; then
              echo "API server is healthy"
              break
            fi
            sleep 2
          done
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5184/ > /dev/null 2>&1; then
              echo "Frontend is serving"
              break
            fi
            sleep 2
          done

      - name: Clean up old Docker images
        run: |
          docker image prune -f --filter "until=24h"
