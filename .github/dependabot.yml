# ─── Dependabot ──────────────────────────────────────────────────────────────
# Automated dependency update PRs for npm, Cargo, pip, and Docker images.
# Runs weekly on Monday, groups minor/patch updates together to reduce noise.

version: 2
updates:
  # ─── Frontend (npm) ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      vite:
        patterns: ["vite", "vitest", "@vitejs/*"]
        update-types: ["minor", "patch"]
      tiptap:
        patterns: ["@tiptap/*"]
        update-types: ["minor", "patch"]
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest*"
          - "jsdom"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  # ─── API Gateway (npm) ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/server/api-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "api-server"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  # ─── Rust Module (Cargo) ────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/server/spacetimedb"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(rust)"

  # ─── Python API Server (pip) ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/server/api-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"

  # ─── Docker Images ──────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/server/api-server"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/server/spacetimedb"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # ─── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(ci)"
