server {
    listen 5184;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    # Clickjacking prevention
    add_header X-Frame-Options "DENY" always;
    # MIME-type sniffing prevention
    add_header X-Content-Type-Options "nosniff" always;
    # Legacy XSS filter (deprecated in modern browsers, set to 0 for safety)
    add_header X-XSS-Protection "0" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Feature restriction (Permissions-Policy v3 syntax)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()" always;
    # HSTS (enforce HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Cross-origin isolation
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content-Security-Policy
    # The app loads from its own origin, connects to the API server via proxy,
    # opens WebSockets to SpacetimeDB, and embeds iframes from various services.
    # script-src needs 'unsafe-inline' and 'unsafe-eval' for React/Tiptap.
    # style-src needs 'unsafe-inline' for CSS-in-JS and KaTeX.
    # connect-src includes ws: for the STDB WebSocket connection.
    # frame-src covers all supported embed providers.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' ws: wss:;
        frame-src 'self'
            https://www.youtube.com
            https://player.vimeo.com
            https://www.loom.com
            https://player.twitch.tv
            https://embed.diagrams.net
            https://www.plantuml.com
            https://www.dailymotion.com
            https://www.figma.com
            https://codepen.io
            https://codesandbox.io
            https://jsfiddle.net
            https://replit.com
            https://docs.google.com;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ── Gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Static assets with cache ───────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy to the Python backend ────────────────────────────────
    location /api/ {
        proxy_pass http://api-server:8711;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenAPI docs proxy ─────────────────────────────────────────────
    location /docs {
        proxy_pass http://api-server:8711;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://api-server:8711;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback — serve index.html for all other routes ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
